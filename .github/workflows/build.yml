name: Build APK

on:
  push:
    branches-ignore:
      - build-output
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: BluettiWatch-apk
          path: app/build/outputs/apk/debug/*.apk

      # Результат сборки (лог + APK) кладётся в ветку build-output,
      # чтобы его можно было забрать обычным git fetch.
      - name: Publish result to build-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/build.log || true
          echo "${{ steps.build.outcome }}" > /tmp/out/STATUS
          echo "${{ github.sha }}" > /tmp/out/SOURCE_COMMIT
          cp app/build/outputs/apk/debug/*.apk /tmp/out/BluettiWatch.apk 2>/dev/null || true
          cd /tmp/out
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.sha }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
